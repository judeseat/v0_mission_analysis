[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "v0-tool"
version = "0.1.0"
description = "V0 generic LEO-PNT mission-analysis foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "sgp4",
    "skyfield",
    "pydantic",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/v0_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
